# Sandbox policy for mise-sbx.
#
# Read ~/.config/mise/AGENTS.md before editing. Rules:
#   [default]        applies to every tool that has no [tools.<name>] entry
#   [tools.<name>]   merged over [default]: allow_read/allow_write/allow_env
#                    are appended, `net` is overridden
#   net = false      no network (seccomp blocks IPv4/IPv6 sockets)
#   net = true       network allowed
#   net = "opt-in"   network only when MISE_SANDBOX_NET=1
#
# Paths: relative paths resolve from the directory mise-sbx was run in, `~` and
# `$VAR`/`${VAR}` are expanded ($XDG_RUNTIME_DIR falls back to /run/user/<uid>).
# Missing paths are dropped (Landlock cannot bind them). A missing write path
# whose last segment has no dot is created first; paths that look like files
# (last segment contains a dot) are skipped.
#
# Path lists are alphabetical, case-insensitive. The [deny] list is the one
# exception: it is grouped by category, alphabetical within each group.
#
# allow_write implies read access to that path.

[default]
allow_read  = ["."]
allow_write = ["."]
net         = false
allow_env   = []

[sync]
# Bins that must not get a wrapper: internal helpers that only their own
# (already sandboxed) parent invokes.
exclude = ["codex-code-mode-host", "opencode2"]
# What to do with ~/.local/bin launchers that Omarchy regenerated
# (omarchy-mise-install): repoint them at mise-sbx, only warn about them, or
# leave them alone.
reconcile = "repoint"

# ---------------------------------------------------------------------------
# Named presets for -p/--preset (repeatable, additive). Built in: home,
# home-ro, all. A preset adds to [default] + [tools.<name>]; [deny] still wins.
# `include` pulls in other presets (transitively; cycles are a config error).
# Presets never change network access: use --net / --no-net for that.
# Paths expand ~ and $VAR/${VAR}; $XDG_RUNTIME_DIR falls back to /run/user/<uid>.
# ---------------------------------------------------------------------------

# Read-only view of an Omarchy desktop: inspect config, theme, compositor and
# window state without changing anything. Meant for debugging. Use
# -p omarchy-rw when the tool has to write.
#
# $XDG_RUNTIME_DIR covers the hypr/quickshell IPC directories, the wayland lock
# files and the dconf database. /usr/share/omarchy is listed even though mise
# grants /usr implicitly; /var/lib/pacman is read because omarchy commands run
# `pacman -Q` for version and dependency checks.
[presets.omarchy]
allow_read  = [
  "$XDG_RUNTIME_DIR",
  "/usr/share/omarchy",
  "/var/lib/pacman",
  "~/.cache/omarchy",
  "~/.config/alacritty",
  "~/.config/btop",
  "~/.config/foot",
  "~/.config/ghostty",
  "~/.config/hypr",
  "~/.config/kitty",
  "~/.config/lazygit",
  "~/.config/omarchy",
  "~/.config/starship.toml",
  "~/.local/share/icons",
  "~/.local/state/omarchy",
]
allow_env   = [
  "HYPRLAND_*",
  "WAYLAND_DISPLAY",
  "XDG_RUNTIME_DIR",
  "XDG_CURRENT_DESKTOP",
  "XDG_SESSION_*",
  "DBUS_SESSION_BUS_ADDRESS",
  "OMARCHY_*",
]

# Same view plus write access, for real customization: `omarchy theme set`,
# region capture, reminders, brightness. omarchy keeps its lock files and
# capture markers directly in $XDG_RUNTIME_DIR, so that directory has to be
# writable too - denying or sub-granting pieces of it would block file
# creation, since Landlock needs MAKE_REG on the parent directory.
[presets.omarchy-rw]
include     = ["omarchy"]
allow_write = [
  "$XDG_RUNTIME_DIR",
  "~/.cache/omarchy",
  "~/.config/alacritty",
  "~/.config/btop",
  "~/.config/foot",
  "~/.config/ghostty",
  "~/.config/hypr",
  "~/.config/kitty",
  "~/.config/lazygit",
  "~/.config/omarchy",
  "~/.config/starship.toml",
  "~/.local/state/omarchy",
]

# ---------------------------------------------------------------------------
# Deny list: subtracted from every grant, including -p home / -p home-ro.
# Landlock has no negative rules, so an allowed parent is split into its
# non-denied children. `-a <path>` overrides a deny at or above that path;
# denies below it still apply. `-p all` ignores this list (with a warning).
# `mise-sbx policy <tool>` shows the expanded rules.
# ---------------------------------------------------------------------------

[deny]
paths = [
  # secrets and credentials
  "~/.aws",
  "~/.azure",
  "~/.cargo/credentials.toml",
  "~/.config/age",
  "~/.config/containers/auth.json",
  "~/.config/gcloud",
  "~/.config/op",
  "~/.config/sops",
  "~/.docker/config.json",
  "~/.gem/credentials",
  "~/.git-credentials",
  "~/.gnupg",
  "~/.kube",
  "~/.local/share/keyrings",
  "~/.netrc",
  "~/.npmrc",
  "~/.password-store",
  "~/.pypirc",
  "~/.ssh",
  # browser profiles
  "~/.config/BraveSoftware",
  "~/.config/chromium",
  "~/.config/google-chrome",
  "~/.config/microsoft-edge",
  "~/.config/vivaldi",
  "~/.mozilla",
  # personal dirs
  "~/Backups",
  "~/Calibre",
  "~/digikam_data",
  "~/Documents",
  "~/Downloads",
  "~/Games",
  "~/Music",
  "~/Music to sort",
  "~/Org",
  "~/Pictures",
  "~/Pictures to sort",
  "~/Recordings",
  "~/Sync",
  "~/Sync Natalie",
  "~/Vaults",
  "~/Videos",
  "~/Wallpapers",
]

# ---------------------------------------------------------------------------
# AI agents: reach their API, keep their own state, access skills
# ---------------------------------------------------------------------------

[tools.claude]
net         = true
allow_write = ["~/.cache/claude", "~/.claude", "~/.local/state/claude"]
allow_read  = ["~/.agents/skills", "~/.claude.json", "~/.claude/skills", "~/.config/git", "~/.gitconfig"]
allow_env   = ["ANTHROPIC_*", "CLAUDE_*"]

[tools.codex]
net         = true
allow_write = ["~/.cache/codex", "~/.codex"]
allow_read  = ["~/.agents/skills", "~/.claude/skills", "~/.config/git", "~/.gitconfig"]
allow_env   = ["OPENAI_*", "CODEX_*"]

[tools.gemini]
net         = true
allow_write = ["~/.gemini"]
allow_read  = ["~/.agents/skills", "~/.claude/skills", "~/.config/git", "~/.gitconfig"]
allow_env   = ["GEMINI_*", "GOOGLE_*", "GOOGLE_CLOUD_*"]

[tools.opencode]
net         = true
allow_write = ["~/.cache/opencode", "~/.config/opencode", "~/.local/share/opencode", "~/.local/state/opencode"]
allow_read  = ["~/.agents/skills", "~/.claude/skills", "~/.config/git", "~/.gitconfig"]
allow_env   = ["OPENCODE_*", "ANTHROPIC_*", "OPENAI_*", "GEMINI_*", "GOOGLE_*", "OPENROUTER_*", "GROQ_*", "MISTRAL_*", "XAI_*"]

[tools.pi]
net         = true
allow_write = ["~/.cache/pi", "~/.local/state/pi", "~/.pi"]
allow_read  = ["~/.agents/skills", "~/.claude/skills", "~/.config/git", "~/.gitconfig"]
allow_env   = ["PI_*"]

# Additional agent CLIs installed on demand by the ~/.local/bin launchers.
# Config dirs are best-effort guesses: run the tool, check the audit log and
# `mise-sbx policy <tool>`, then correct the paths here.

[tools.copilot]
net         = true
allow_write = ["~/.cache/github-copilot", "~/.config/github-copilot", "~/.local/share/github-copilot"]
allow_read  = ["~/.agents/skills", "~/.claude/skills", "~/.config/git", "~/.gitconfig"]
allow_env   = ["GH_*", "GITHUB_*", "COPILOT_*"]

[tools.crush]
net         = true
allow_write = ["~/.cache/crush", "~/.config/crush", "~/.local/share/crush"]
allow_read  = ["~/.agents/skills", "~/.claude/skills", "~/.config/git", "~/.gitconfig"]
allow_env   = ["ANTHROPIC_*", "OPENAI_*", "GEMINI_*", "GROQ_*", "OPENROUTER_*", "CRUSH_*"]

[tools.cursor-agent]
net         = true
allow_write = ["~/.cache/cursor-agent", "~/.config/cursor", "~/.cursor", "~/.local/share/cursor-agent"]
allow_read  = ["~/.agents/skills", "~/.claude/skills", "~/.config/git", "~/.gitconfig"]
allow_env   = ["CURSOR_*"]

[tools.gh]
net         = true
allow_write = ["~/.cache/gh", "~/.config/gh", "~/.local/state/gh"]
allow_read  = ["~/.config/git", "~/.gitconfig"]
allow_env   = ["GH_*", "GITHUB_*", "GIT_*"]

[tools.ghui]
net         = true
allow_write = ["~/.cache/ghui", "~/.config/ghui", "~/.local/share/ghui"]
allow_read  = ["~/.config/git", "~/.gitconfig"]
allow_env   = ["GH_*", "GITHUB_*"]

[tools.grok]
net         = true
allow_write = ["~/.cache/grok", "~/.config/grok", "~/.grok", "~/.local/share/grok"]
allow_read  = ["~/.agents/skills", "~/.claude/skills", "~/.config/git", "~/.gitconfig"]
allow_env   = ["XAI_*", "GROK_*"]

[tools.hunk]
net         = true
allow_write = ["~/.cache/hunk", "~/.config/hunk", "~/.local/share/hunk"]
allow_read  = ["~/.agents/skills", "~/.claude/skills", "~/.config/git", "~/.gitconfig"]
allow_env   = ["ANTHROPIC_*", "OPENAI_*", "HUNK_*"]

[tools.muse]
net         = true
allow_write = ["~/.cache/muse", "~/.config/muse", "~/.local/share/muse", "~/.muse"]
allow_read  = ["~/.agents/skills", "~/.claude/skills", "~/.config/git", "~/.gitconfig"]
allow_env   = ["MUSE_*"]

[tools.omp]
net         = true
allow_write = ["~/.cache/omp", "~/.config/omp", "~/.local/share/omp"]
allow_read  = ["~/.agents/skills", "~/.claude/skills", "~/.config/git", "~/.gitconfig"]
allow_env   = ["ANTHROPIC_*", "OPENAI_*", "OMP_*"]

[tools.playwright]
net         = true
allow_write = ["~/.cache/ms-playwright", "~/.cache/playwright", "~/.config/playwright"]
allow_read  = ["~/.config/git", "~/.gitconfig"]
allow_env   = ["PLAYWRIGHT_*", "NODE_*"]

# ---------------------------------------------------------------------------
# Package managers: network for installs, caches writable, nothing else
# ---------------------------------------------------------------------------

[tools.npm]
net         = true
allow_write = ["~/.cache/npm", "~/.npm"]
allow_read  = ["~/.config/git", "~/.gitconfig", "~/.node_repl_history"]
allow_env   = ["NPM_*", "npm_*", "NODE_*", "NODE_ENV"]

[tools.npx]
net         = true
allow_write = ["~/.cache/npm", "~/.npm"]
allow_read  = ["~/.config/git", "~/.gitconfig", "~/.node_repl_history"]
allow_env   = ["NPM_*", "npm_*", "NODE_*", "NODE_ENV"]

[tools.pnpm]
net         = true
allow_write = ["~/.cache/pnpm", "~/.config/pnpm", "~/.local/share/pnpm"]
allow_read  = ["~/.config/git", "~/.gitconfig"]
allow_env   = ["PNPM_*", "NPM_*", "npm_*", "NODE_*", "NODE_ENV"]

[tools.yarn]
net         = true
allow_write = ["~/.cache/yarn", "~/.config/yarn", "~/.yarn"]
allow_read  = ["~/.config/git", "~/.gitconfig"]
allow_env   = ["YARN_*", "NPM_*", "npm_*", "NODE_*", "NODE_ENV"]

[tools.bun]
net         = true
allow_write = ["~/.bun", "~/.cache/bun"]
allow_read  = ["~/.config/git", "~/.gitconfig"]
allow_env   = ["BUN_*", "NODE_*", "NODE_ENV"]

[tools.uv]
net         = true
allow_write = ["~/.cache/uv", "~/.config/uv"]
allow_read  = ["~/.config/git", "~/.gitconfig"]
allow_env   = ["UV_*"]

[tools.uvx]
net         = true
allow_write = ["~/.cache/uv", "~/.config/uv"]
allow_read  = ["~/.config/git", "~/.gitconfig"]
allow_env   = ["UV_*"]

# ---------------------------------------------------------------------------
# Zig: compiler, not just a package manager. Offline unless
# MISE_SANDBOX_NET=1, which `zig fetch` / a build pulling deps will need.
# Global cache is ~/.cache/zig; Zig has no config directory of its own.
# ---------------------------------------------------------------------------

[tools.zig]
net         = "opt-in"
allow_write = ["~/.cache/zig"]
allow_read  = ["~/.config/git", "~/.gitconfig"]
allow_env   = ["ZIG_*"]

# ---------------------------------------------------------------------------
# Node itself: offline unless MISE_SANDBOX_NET=1
# ---------------------------------------------------------------------------

[tools.node]
net         = "opt-in"
allow_write = ["~/.cache/node", "~/.npm/_logs"]
allow_read  = ["~/.config/git", "~/.gitconfig", "~/.node_repl_history"]
allow_env   = ["NODE_*", "NODE_ENV"]
